name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mygainz
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mygainz/package-lock.json
      - run: npm ci
      - run: npm test -- --watchAll=false --passWithNoTests
        env:
          CI: "true"
      - run: npm run build
        env:
          CI: "true"
